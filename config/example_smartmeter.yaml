# Wiener Netze M1 smart meter (Iskraemeko) -> Home Assistant
# Board: Wemos S2 Mini (ESP32-S2), battery powered, deep sleep between readings.
#
# Placeholders to replace before flashing (search for "CHANGE ME"):
#   wifi ssid/password, api encryption key, wiener_netze security_key.
# Better: move them to secrets.yaml and use !secret.

esphome:
  name: smartmeter-wiener-netze
  friendly_name: Smartmeter Wiener Netze
  on_boot:
    # Priority 500 runs after the sensors are set up (600) and before WiFi
    # starts (250), so the battery is sampled before the radio transmits.
    priority: 500
    then:
      - component.update: battery_voltage

external_components:
  # Local development: the component lives in ../components of this repo.
  - source:
      type: local
      path: ../components
    components: [wiener_netze]
  # In Home Assistant use instead:
  # - source: github://zeha/wiener-netze-smartmeter-slop@main
  #   components: [wiener_netze]

esp32:
  board: lolin_s2_mini  # Wemos/LOLIN S2 Mini (ESPHome has no "wemos_s2_mini" id)
  variant: esp32s2
  framework:
    type: esp-idf

logger:
  # The S2 Mini logs over native USB, the hardware UARTs stay free for the meter.
  level: DEBUG

wifi:
  ssid: "YOUR_WIFI_SSID"          # CHANGE ME
  password: "YOUR_WIFI_PASSWORD"  # CHANGE ME
  # Recommended for battery use: a static IP skips DHCP and shortens every wake-up.
  # manual_ip:
  #   static_ip: 192.168.1.50
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0
  #   dns1: 192.168.1.1
  fast_connect: true

api:
  encryption:
    # CHANGE ME: placeholder (decodes to "CHANGE_ME..."); generate your own with `openssl rand -base64 32`.
    key: "Q0hBTkdFX01FX0NIQU5HRV9NRV9DSEFOR0VfTUVfISE="

ota:
  - platform: esphome

uart:
  id: meter_uart
  rx_pin: GPIO21   # data line of the passive IR read head; receive only, no tx_pin
  baud_rate: 9600  # 8N1
  # Some IR heads output an inverted signal; if no frame ever arrives, try:
  # rx_pin:
  #   number: GPIO21
  #   inverted: true

wiener_netze:
  uart_id: meter_uart
  # CHANGE ME: the 32-hex-character key from the Wiener Netze Smart Meter portal
  # (Kundenschnittstelle). This value is a placeholder and will not decrypt anything.
  security_key: "0123456789abcdef0123456789abcdef"
  read_timeout: 10s
  on_telegram:
    # One telegram per wake-up is enough: wait until Home Assistant is connected
    # so the values are delivered, then go back to sleep.
    - wait_until:
        condition: api.connected
        timeout: 20s
    - delay: 1s
    - deep_sleep.enter: deep_sleep_1

deep_sleep:
  id: deep_sleep_1
  # Fallback if no telegram arrives (IR head misaligned, wrong key, no WiFi).
  run_duration: 40s
  # The meter pushes about once per second; 1min..10min are sensible, longer saves battery.
  sleep_duration: 5min

sensor:
  # Battery: 1 MOhm / 1 MOhm divider from the LiPo's + terminal (before any
  # regulator, never the board's 3V3 rail) to GPIO3 (ADC1), lower resistor to
  # GND, optional 100 nF from GPIO3 to GND. Sampled once per wake-up, right
  # after boot and before WiFi transmits; WiFi load makes the cell sag a little,
  # so treat the value as an estimate.
  - platform: adc
    id: battery_voltage
    name: "Smartmeter battery voltage"
    pin: GPIO3
    attenuation: 12db
    samples: 64              # oversampling: average of 64 readings per update
    update_interval: never   # sampled by esphome.on_boot above
    device_class: voltage
    unit_of_measurement: V
    state_class: measurement
    accuracy_decimals: 2
    entity_category: diagnostic
    filters:
      - multiply: 2.0        # divider ratio 0.5: pin voltage -> battery voltage
    on_value:
      - component.update: battery_level
  - platform: template
    id: battery_level
    name: "Smartmeter battery level"
    device_class: battery
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never   # updated whenever a new voltage arrives
    # Rough LiPo open-circuit curve; good enough as a reminder to recharge.
    lambda: |-
      const float v = id(battery_voltage).state;
      if (std::isnan(v)) return {};
      if (v >= 4.15f) return 100.0f;
      if (v >= 4.05f) return 85.0f;
      if (v >= 3.95f) return 70.0f;
      if (v >= 3.85f) return 55.0f;
      if (v >= 3.75f) return 40.0f;
      if (v >= 3.65f) return 25.0f;
      if (v >= 3.55f) return 12.0f;
      if (v >= 3.45f) return 5.0f;
      return 0.0f;

  - platform: wiener_netze
    type: energy_active_plus
    name: "Energy import"
  - platform: wiener_netze
    type: energy_active_minus
    name: "Energy export"
  - platform: wiener_netze
    type: energy_reactive_plus
    name: "Reactive energy import"
  - platform: wiener_netze
    type: energy_reactive_minus
    name: "Reactive energy export"
  - platform: wiener_netze
    type: power_active_plus
    name: "Power import"
  - platform: wiener_netze
    type: power_active_minus
    name: "Power export"
  - platform: wiener_netze
    type: power_reactive_plus
    name: "Reactive power import"
  - platform: wiener_netze
    type: power_reactive_minus
    name: "Reactive power export"
  - platform: wiener_netze
    type: telegram_count
    name: "Telegrams decoded"

text_sensor:
  - platform: wiener_netze
    type: timestamp
    name: "Meter time"
