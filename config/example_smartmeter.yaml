# Smart meter reader: Wiener Netze M1 (Iskraemeko) -> Home Assistant
#
# This file mirrors the config that is actually running on the deployed
# reader (kept in the Home Assistant ESPHome builder); every secret and
# network detail is replaced by a placeholder. Replace the "CHANGE ME"
# values - and the entries in secrets.yaml - before flashing.
#
# Hardware: Wemos S2 Mini (ESP32-S2, 4 MB flash), passive IR read head,
# 7000 mAh LiPo, deep sleep between readings. The board's built-in LED
# (GPIO15) is the status indicator while awake, no wiring needed.
#
#   VCC  -> 3V3
#   GND  -> GND
#   Data out of the head (Hichi IR TTL: yellow wire) -> GPIO11
#
# ESPHome enables no pull-up on the RX pin by itself; the internal one is
# turned on below. If nothing arrives at all, the head may output an
# inverted signal - set `inverted: true` on rx_pin.

esphome:
  name: smartmeter-reader
  friendly_name: Smartmeter reader
  on_boot:
    # Sample the chip temperature once per wake-up (priority 500 runs
    # after the sensors are set up at 600, before WiFi starts at 250).
    # The sensor itself polls only on demand (update_interval: never).
    - priority: 500
      then:
        - component.update: chip_temperature
    # Status LED (design: vault note
    # projects/wiener-netze-smartmeter/research/led-status-indicator,
    # 2026-11-16): slow blink = alive; after 15 s, solid = Wi-Fi down,
    # fast blink = Wi-Fi up but no telegram yet (meter/IR problem).
    # A slow-but-working AP fallback can show a false solid for a few
    # seconds; the first telegram cancels it (see on_telegram).
    - priority: 490
      then:
        - light.turn_on:
            id: status_led
            effect: "Slow blink"
        - delay: 15s
        - if:
            condition: wifi.connected
            then:
              - if:
                  condition:
                    lambda: |-
                      return !id(telegram_count).has_state();
                  then:
                    - light.turn_on:
                        id: status_led
                        effect: "Fast blink"
            else:
              - light.turn_on:
                  id: status_led
                  effect: none

# Enables the debug sensor/text_sensor platforms below (CPU frequency,
# reset reason) - required, no options.
debug:

external_components:
  # Same commit the deployed firmware was built from; bump to a newer
  # commit (or @main) once the change you need has landed.
  - source: github://zeha/wiener-netze-smartmeter-slop@b03548d024f8bb8c4497457264e9bb4d39ad721e
    components: [wiener_netze]
  # Local development: components live in ../components of this repo.
  # sleep_guard only exists locally until the owner pushes it and bumps
  # the github pin above (then move it into the github component list).
  - source:
      type: local
      path: ../components
    components: [sleep_guard]

esp32:
  variant: esp32s2
  flash_size: 4MB
  framework:
    type: esp-idf

# INFO is enough once it works; raise to DEBUG for frame-level logs.
logger:

uart:
  id: meter_uart
  rx_pin:
    number: GPIO11
    mode:
      input: true
      pullup: true
  baud_rate: 9600

api:
  encryption:
    # CHANGE ME: placeholder (decodes to "CHANGE_ME..."); generate your own
    # with `openssl rand -base64 32`.
    key: "Q0hBTkdFX01FX0NIQU5HRV9NRV9DSEFOR0VfTUVfISE="

ota:
  - platform: esphome

wifi:
  # Provided by secrets.yaml (in the builder: the secrets pane), e.g.:
  #   wifi_ssid: "YourHomeWifi"
  #   wifi_password: "your-wifi-password"
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  # A static IP shortens the wake-up time (CHANGE ME to your network):
  # manual_ip:
  #   static_ip: 192.168.0.50
  #   gateway: 192.168.0.1
  #   subnet: 255.255.255.0
  #   dns1: 192.168.0.1

wiener_netze:
  uart_id: meter_uart
  # CHANGE ME: your 32-hex-digit meter key from the portal. Never commit a
  # real key - keep it in secrets.yaml (`security_key: !secret meter_key`).
  security_key: "0123456789abcdef0123456789abcdef"
  read_timeout: 10s
  on_telegram:
    # A telegram is proof of life: cancel any alarm pattern first, then
    # wait until Home Assistant is connected so the values are delivered
    # (solid on the LED if it is not), and go back to sleep.
    - light.turn_on:
        id: status_led
        effect: "Slow blink"
    - wait_until:
        condition: api.connected
        timeout: 20s
    - if:
        condition: api.connected
        then:
          - light.turn_off:
              id: status_led
        else:
          - light.turn_on:
              id: status_led
              effect: none
          - delay: 10s
    - delay: 1s
    - deep_sleep.enter: deep_sleep_1

deep_sleep:
  id: deep_sleep_1
  # Fallback if no telegram arrives (IR head misaligned, wrong key, no
  # WiFi): sleep after this time regardless.
  run_duration: 40s
  # The meter pushes about once per second; 1min..10min are sensible,
  # longer saves battery.
  sleep_duration: 5min

# Safety net for the 2026-11-16 deep-sleep hang: if sleep entry never
# completes, deep_sleep's one-shot wake timer is consumed and the device
# stays awake forever with the pipeline dead. sleep_guard (a) restarts the
# device if the main loop stalls for 2min (the loop task never trips the
# TWDT on this chip), and (b) forces a sleep entry if the device is still
# awake run + sleep + 10min after boot. run_duration / sleep_duration must
# mirror the deep_sleep values above.
sleep_guard:
  deep_sleep_id: deep_sleep_1
  run_duration: 40s
  sleep_duration: 5min

output:
  # Built-in S2 Mini LED (LED1, 0603 blue, GPIO15 via R5 2 kOhm,
  # active-high). The ~0.2 mA it draws while awake is negligible for the
  # battery; in deep sleep the GPIO is released and it costs nothing.
  - platform: gpio
    id: status_led_out
    pin: GPIO15

light:
  # Status indicator while awake (see the on_boot / on_telegram hooks):
  #   slow blink ~1 Hz  = alive
  #   fast blink  5 Hz  = Wi-Fi up, no meter data
  #   solid on          = network failure (Wi-Fi down or HA unreachable)
  # Strobe = hard on/off square wave. The light entity is also a manual
  # test hook in Home Assistant.
  - platform: binary
    name: "Status LED"
    id: status_led
    output: status_led_out
    effects:
      - strobe:
          name: "Slow blink"
          id: effect_slow
          colors:
            - state: true
              duration: 150ms
            - state: false
              duration: 850ms
      - strobe:
          name: "Fast blink"
          id: effect_fast
          colors:
            - state: true
              duration: 100ms
            - state: false
              duration: 100ms

sensor:
  - platform: wiener_netze
    type: energy_active_plus
    name: "Energy import"
  - platform: wiener_netze
    type: energy_active_minus
    name: "Energy export"
  - platform: wiener_netze
    type: energy_reactive_plus
    name: "Reactive energy import"
  - platform: wiener_netze
    type: energy_reactive_minus
    name: "Reactive energy export"
  - platform: wiener_netze
    type: power_active_plus
    name: "Power import"
  - platform: wiener_netze
    type: power_active_minus
    name: "Power export"
  - platform: wiener_netze
    type: power_reactive_plus
    name: "Reactive power import"
  - platform: wiener_netze
    type: power_reactive_minus
    name: "Reactive power export"
  - platform: wiener_netze
    type: telegram_count
    name: "Telegrams decoded"
    id: telegram_count
  # Diagnostics (added 2026-11-15): what the last reset was, how warm the
  # hallway/cupboard is, and the WiFi link at the meter.
  - platform: internal_temperature
    id: chip_temperature
    name: "Internal temperature sensor"
    update_interval: never  # sampled once per wake-up, see esphome.on_boot
  - platform: debug
    cpu_frequency:
      name: "CPU frequency"
  - platform: wifi_signal
    name: "WiFi signal sensor"
  # Battery voltage - not in the deployed build: the 1 MOhm divider lives
  # on the power dock, which is not wired at the meter yet. Un-comment
  # once the divider is connected (R1 1 MOhm battery+ -> GPIO3, R2 1 MOhm
  # GPIO3 -> GND, optionally C 100 nF):
  # - platform: adc
  #   id: battery_voltage
  #   name: "Smartmeter battery voltage"
  #   pin: GPIO3
  #   attenuation: 12db
  #   update_interval: never
  # - platform: template
  #   name: "Smartmeter battery level"
  #   unit_of_measurement: "%"
  #   accuracy_decimals: 0
  #   device_class: battery
  #   state_class: measurement
  #   lambda: |-
  #     auto v = id(battery_voltage).state * 2.0;   # 1:1 divider
  #     if (v >= 4.15f) return 100.0;
  #     if (v >= 4.05f) return 85.0;
  #     if (v >= 3.95f) return 70.0;
  #     if (v >= 3.85f) return 55.0;
  #     if (v >= 3.75f) return 40.0;
  #     if (v >= 3.65f) return 25.0;
  #     if (v >= 3.55f) return 12.0;
  #     if (v >= 3.45f) return 5.0;
  #     return 0.0;

text_sensor:
  - platform: wiener_netze
    type: timestamp
    name: "Meter time"
  - platform: debug
    reset_reason:
      name: "Reset reason"

# Not in the deployed config: the customer interface may also be driven
# by a connected amsreader. If the board ever shows "PIN" or no frames
# arrive at all, hold the head's transmit input (Hichi: green wire) low to
# force the meter into passive mode - GPIO12, `initial_state: true`, plus
# `output.turn_on` in esphome.on_boot above.
